<!DOCTYPE html>
<html>
<head>
    <title>Test Conversations JS</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 3px solid #333; }
        .error { border-color: red; background: #ffe6e6; }
        .success { border-color: green; background: #e6ffe6; }
    </style>
</head>
<body>
    <h1>Conversations API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="output"></div>

    <script>
    async function testAPI() {
        const output = document.getElementById('output');
        output.innerHTML = '<div class="log">Testing...</div>';

        try {
            const response = await fetch('../api/chat/conversations.php');
            const text = await response.text();
            
            output.innerHTML += `<div class="log"><strong>Raw Response:</strong><pre>${text}</pre></div>`;

            try {
                const data = JSON.parse(text);
                output.innerHTML += `<div class="log success"><strong>Parsed JSON:</strong><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                
                if (data.success) {
                    output.innerHTML += `<div class="log success">✅ Found ${data.conversations ? data.conversations.length : 0} users</div>`;
                } else {
                    output.innerHTML += `<div class="log error">❌ API returned error: ${data.error}</div>`;
                }
            } catch (e) {
                output.innerHTML += `<div class="log error">❌ JSON Parse Error: ${e.message}</div>`;
            }
        } catch (error) {
            output.innerHTML += `<div class="log error">❌ Fetch Error: ${error.message}</div>`;
        }
    }
    </script>
</body>
</html>
